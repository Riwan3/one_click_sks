# OneClick Laravel — produksi dengan Docker Compose.
# Layanan: caddy (HTTPS otomatis), app (Nginx + PHP-FPM), queue, scheduler, mysql. Semua konfigurasi dibaca dari file .env.
#
# Pertama kali : cp .env.docker.example .env  (isi password & APP_URL)  ->  docker compose up -d --build
# Update kode  : ./deploy.sh

# Resolver DNS publik IPv4. Tanpa ini container memakai resolver server apa adanya; di sebagian VPS resolver itu
# IPv6 yang tidak terjangkau dari container ("network is unreachable"), sehingga Caddy gagal meminta sertifikat
# Let's Encrypt dan aplikasi gagal memanggil API luar (HO, FCM).
x-dns: &public-dns
  - 1.1.1.1
  - 8.8.8.8

services:
  app:
    build: .
    image: oneclick-app:latest
    container_name: oneclick_app
    restart: unless-stopped
    dns: *public-dns
    environment:
      CONTAINER_ROLE: app
    env_file: .env
    # Hanya bisa diakses dari server itu sendiri; dari luar lewat Caddy atau web server yang sudah ada (reverse proxy).
    ports:
      - "127.0.0.1:${APP_FORWARD_PORT:-8080}:80"
    volumes:
      - ./.env:/app/.env:ro,z
      - app_storage:/app/storage
      - app_uploads:/app/public/assets/uploads
      - ./secrets:/app/secrets:ro,z
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - oneclick

  queue:
    image: oneclick-app:latest
    container_name: oneclick_queue
    restart: unless-stopped
    dns: *public-dns
    user: www-data
    environment:
      CONTAINER_ROLE: queue
    env_file: .env
    volumes:
      - ./.env:/app/.env:ro,z
      - app_storage:/app/storage
      - app_uploads:/app/public/assets/uploads
      - ./secrets:/app/secrets:ro,z
    depends_on:
      app:
        condition: service_started
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    networks:
      - oneclick

  scheduler:
    image: oneclick-app:latest
    container_name: oneclick_scheduler
    restart: unless-stopped
    dns: *public-dns
    user: www-data
    environment:
      CONTAINER_ROLE: scheduler
    env_file: .env
    volumes:
      - ./.env:/app/.env:ro,z
      - app_storage:/app/storage
      - app_uploads:/app/public/assets/uploads
      - ./secrets:/app/secrets:ro,z
    depends_on:
      app:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]
    networks:
      - oneclick

  caddy:
    image: caddy:2-alpine
    container_name: oneclick_caddy
    restart: unless-stopped
    # Aktif hanya bila COMPOSE_PROFILES=caddy di .env (port 80/443 server harus kosong).
    profiles: ["caddy"]
    dns: *public-dns
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - oneclick

  mysql:
    image: mysql:8.4
    container_name: oneclick_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - oneclick

networks:
  oneclick:
    driver: bridge

volumes:
  mysql_data:
  app_storage:
  app_uploads:
  caddy_data:
  caddy_config:
