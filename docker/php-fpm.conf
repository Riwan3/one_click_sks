; Production PHP-FPM Configuration for Laravel 13

[global]
; Process manager settings
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.process_idle_timeout = 10s
pm.max_requests = 1000

; Error logging
error_log = /proc/self/fd/2
log_level = warning

; Security
listen = 0.0.0.0:9000
listen.backlog = 65535

; Request timeout
request_terminate_timeout = 300s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

; Access logging
access.log = /proc/self/fd/2
access.format = "%R - %u %t \"%m %r%Q%q\" %s %l %{mili}d %{megabytes}M %C%%"

; Pool configuration
[www]
user = laravel
group = laravel

listen = 0.0.0.0:9000
listen.owner = laravel
listen.group = laravel

pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.process_idle_timeout = 10s

; Environment variables
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp
