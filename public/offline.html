<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tidak Ada Koneksi - One Click</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            background: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px 28px 32px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .icon-wrap {
            width: 80px; height: 80px;
            background: #fff1f2;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.2rem;
            color: #7b112c;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #1e293b;
            margin: 0 0 8px;
        }
        p {
            color: #64748b;
            font-size: 0.875rem;
            margin: 0 0 24px;
            line-height: 1.6;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #7b112c;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(123,17,44,0.3);
            text-decoration: none;
        }
        .btn:active { opacity: 0.88; }
        .logo-wrap {
            width: 52px; height: 52px;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
        .footer { color: #94a3b8; font-size: 0.7rem; margin-top: 28px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <img src="/images/title.png" alt="One Click">
        </div>

        <div class="icon-wrap">&#128246;</div>

        <h1>Tidak Ada Koneksi</h1>
        <p>Pastikan perangkat Anda terhubung ke jaringan internet, lalu coba muat ulang.</p>

        <button class="btn" onclick="window.location.reload()">Coba Lagi</button>
    </div>

    <div class="footer">&copy; 2026 One Click - PT Putra Perkasa Abadi</div>
</body>
</html>
